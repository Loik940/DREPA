# Ce workflow lance un build Android Preview interne avec EAS Build.
# Il démarre uniquement après un déclenchement manuel dans GitHub Actions.
# Il lit EXPO_TOKEN depuis les secrets GitHub sans jamais afficher sa valeur.
# Il ne publie aucune version Production et ne remplace pas la recette humaine.
# Une personne doit autoriser l'environnement Preview et contrôler le build obtenu.

name: Build Android Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preview
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les espaces et fins de ligne
        run: git diff --check HEAD^ HEAD

      - name: Vérifier la présence du jeton Expo
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Le secret GitHub EXPO_TOKEN est requis pour lancer un build Android Preview."
            exit 1
          fi

          echo "Le secret EXPO_TOKEN est configuré."

      - name: Vérifier TypeScript, ESLint et Jest
        run: |
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Vérifier Expo
        run: |
          npx expo install --check
          npm run doctor

      - name: Configurer Expo et EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 22.0.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Vérifier les variables publiques EAS
        run: eas env:exec preview "npm run env:check -- --expected=preview" --non-interactive

      - name: Lancer le build Android Preview
        run: eas build --platform android --profile preview --non-interactive
