# Ce workflow vérifie la qualité et la sécurité du dépôt DRÉPA.
# Il démarre sur main, sur les pull requests vers main ou manuellement.
# Il utilise seulement des droits de lecture et ne demande aucun secret Supabase.
# Il ne déploie rien et le contrôle de secrets cible uniquement des motifs de vraies clés.
# Une personne doit examiner les résultats et valider toute fusion ou correction.

name: Qualité et sécurité

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Scanner les secrets dans tout l'historique
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner

      - name: Scanner le code avec Semgrep Community
        id: semgrep
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.173.0
          semgrep scan --config=p/default --error --metrics=off --exclude=node_modules --exclude=.expo . > semgrep-output.txt 2>&1

      - name: Publier le rapport Semgrep
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-output
          path: semgrep-output.txt
          if-no-files-found: warn

      - name: Configurer Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.0

      - name: Vérifier l'Edge Function
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/delete-account/index.ts
          deno lint --config supabase/functions/deno.json supabase/functions/delete-account/index.ts

      - name: Démarrer et vérifier Supabase local
        run: |
          npx supabase start
          npx supabase db reset
          npx supabase db lint --local

      - name: Vérifier les espaces et fins de ligne
        run: git diff --check HEAD^ HEAD

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Vérifier ESLint
        run: npm run lint

      - name: Exécuter les tests
        run: npm test -- --coverage --testPathIgnorePatterns='[\\/]\.kilo[\\/]'

      - name: Vérifier les versions Expo
        run: npx expo install --check

      - name: Vérifier le projet Expo
        run: npx expo-doctor

      - name: Auditer les dépendances de production critiques
        run: npm audit --omit=dev --audit-level=critical

      - name: Détecter les secrets réels suivis par Git
        shell: bash
        run: |
          service_role_name='SUPABASE_SERVICE_ROLE_KEY'
          patterns="imole_live_[A-Za-z0-9_-]{16,}|sb_secret_[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,}|${service_role_name}=[[:space:]]*['\"]?[^[:space:]'\"#]+"
          matches="$(git grep -n -I -E "$patterns" -- . ':(exclude)package-lock.json' || true)"

          if [ -n "$matches" ]; then
            echo "Des motifs de secrets réels ont été détectés dans des fichiers suivis par Git :"
            printf '%s\n' "$matches" | cut -d: -f1,2
            exit 1
          fi

          echo "Aucun motif de secret réel détecté."

      - name: Échouer si Semgrep a détecté un problème
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

      - name: Arrêter Supabase local
        if: always()
        run: npx supabase stop --no-backup
