# Ce workflow vérifie la qualité et la sécurité du dépôt DRÉPA.
# Il démarre sur main, sur les pull requests vers main ou manuellement.
# Il utilise seulement des droits de lecture et ne demande aucun secret Supabase.
# Il ne déploie rien et le contrôle de secrets cible uniquement des motifs de vraies clés.
# Une personne doit examiner les résultats et valider toute fusion ou correction.

name: Qualité et sécurité

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Configurer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Démarrer et vérifier Supabase local
        run: |
          npx supabase start
          npx supabase db reset
          npx supabase db lint --local

      - name: Vérifier les espaces et fins de ligne
        run: git diff --check HEAD^ HEAD

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Vérifier ESLint
        run: npm run lint

      - name: Exécuter les tests
        run: npm test -- --coverage --testPathIgnorePatterns='[\\/]\.kilo[\\/]'

      - name: Vérifier les versions Expo
        run: npx expo install --check

      - name: Vérifier le projet Expo
        run: npx expo-doctor

      - name: Auditer les dépendances de production critiques
        run: npm audit --omit=dev --audit-level=critical

      - name: Détecter les secrets réels suivis par Git
        shell: bash
        run: |
          service_role_name='SUPABASE_SERVICE_ROLE_KEY'
          patterns="imole_live_[A-Za-z0-9_-]{16,}|sb_secret_[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,}|${service_role_name}=[[:space:]]*['\"]?[^[:space:]'\"#]+"
          matches="$(git grep -n -I -E "$patterns" -- . ':(exclude)package-lock.json' || true)"

          if [ -n "$matches" ]; then
            echo "Des motifs de secrets réels ont été détectés dans des fichiers suivis par Git :"
            printf '%s\n' "$matches" | cut -d: -f1,2
            exit 1
          fi

          echo "Aucun motif de secret réel détecté."

      - name: Arrêter Supabase local
        if: always()
        run: npx supabase stop --no-backup
