# Ce fichier configure les propositions de mises à jour des dépendances.
# Dependabot vérifie npm et GitHub Actions chaque lundi selon le fuseau du projet.
# Il ne contient aucun secret et limite le nombre de pull requests ouvertes.
# Il ne fusionne rien automatiquement et ne déclenche aucune livraison Production.
# Une personne doit examiner, tester et fusionner chaque mise à jour proposée.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Porto-Novo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Porto-Novo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
